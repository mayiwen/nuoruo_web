[package]
name = "nuoruo-web"
version = "0.1.0"
edition = "2021"
authors = ["Nuoruo Team"]
description = "A lightweight frontend framework built with Rust and WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Document",
  "Window",
  "Element",
  "HtmlElement",
  "Node",
  "console",
  "HtmlTemplateElement",
  "DocumentFragment",
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = "s"
